services:
  - type: web
    name: nutraceutical-reviewer
    runtime: python
    runtimeVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: GOOGLE_API_KEY
        scope: run
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: chroma_db
      mountPath: /chroma_db
      sizeGB: 1
